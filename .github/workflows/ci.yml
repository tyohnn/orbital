name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # rustup 은 rust-toolchain.toml 의 버전과 구성 요소를 읽어 설치한다
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
      # 실제 DB 에 역할을 세우는 테스트가 가장 높은 버전의 PostgreSQL 을 쓴다
      - run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -sS -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-19
      # sudo 는 환경 변수를 넘기지 않는다. 자리를 명령 안에 적는다. 러너의 작업 폴더는 postgres 사용자가 닿지 못한다
      - run: sudo PG_DATA=/tmp/orbital-pg scripts/pg-local.sh
      # 백업의 테스트(orbital-backup · orbital-server 의 backup)는 이 클러스터를 쓰지 않고 테스트마다 자기 클러스터를 initdb 로 세운다.
      # CI(환경 변수 CI)에서는 도구가 없어도 건너뛰지 않고 실패한다
      - run: ORBITAL_PG=postgres://postgres@127.0.0.1:54519/postgres npm run pr:check

  # 실제 프레임워크(Next.js, NestJS + Vite)의 본보기를 레이어에 세운다. 레지스트리에서 npm ci 로 받고 빌드해 느리므로 기본 게이트와 따로 돈다.
  # 러너는 바로 나가므로 빌드에 건넬 운영자의 환경(프록시 · CA 묶음)이 없다. 테스트의 목록에서 값이 없는 이름은 건너뛴다
  frameworks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-frameworks-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
      - run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -sS -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-19
      - run: sudo PG_DATA=/tmp/orbital-pg scripts/pg-local.sh
      # 실제 브라우저의 테스트(crates/orbital-server/tests/browser/*.cjs)가 require('playwright') 로 Chromium 을 띄운다.
      # 전역에 깔고 NODE_PATH 로 찾게 한다. CI 에서는 브라우저가 없으면 건너뛰지 않고 실패한다
      - run: npm install --global playwright@1.63.0 && npx --yes playwright@1.63.0 install --with-deps chromium
      - run: NODE_PATH="$(npm root --global)" ORBITAL_PG=postgres://postgres@127.0.0.1:54519/postgres npm run test:frameworks
