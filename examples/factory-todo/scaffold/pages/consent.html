<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>연결 허락</title>
<!-- 동의 화면은 레이어가 말한 것만 보여요. 허락은 사람이 단추를 눌렀을 때만 보내요 -->
<main>
    <h1 id="title">연결을 허락할까요?</h1>
    <p id="who"></p>
    <p>허락하면 이 앱이 내 할 일 카드를 읽고 고칠 수 있어요. 언제든 연결 목록에서 끊을 수 있어요.</p>
    <div id="choices" hidden>
        <button id="allow" type="button">허락</button>
        <button id="refuse" type="button">거절</button>
    </div>
    <p id="gone" role="alert" hidden>이 요청은 끝났어요. 연결하려던 앱에서 다시 시작해 주세요.</p>
</main>
<script type="module">
    import { approve, consentRequest, deny, me } from "/vendor/orbital-app.js";

    const id = new URLSearchParams(location.search).get("request") ?? "";
    const allow = document.getElementById("allow");
    const refuse = document.getElementById("refuse");

    if ((await me()) === null)
    {
        location.assign(`/login?next=${encodeURIComponent(location.pathname + location.search)}`);
    }
    else
    {
        try
        {
            const asked = await consentRequest(id);
            // 이름과 돌아갈 곳은 레이어가 준 글자 그대로 보인다. HTML 로 읽지 않는다
            document.getElementById("who").textContent =
                `${asked.client.name} (${asked.client.redirectHost}) 이 연결을 요청했어요.`;
            document.getElementById("choices").hidden = false;
        }
        catch
        {
            document.getElementById("gone").hidden = false;
        }
    }

    allow.addEventListener("click", async () =>
    {
        allow.disabled = refuse.disabled = true;
        location.assign((await approve(id)).redirect);
    });
    refuse.addEventListener("click", async () =>
    {
        allow.disabled = refuse.disabled = true;
        location.assign((await deny(id)).redirect);
    });
</script>
</html>
