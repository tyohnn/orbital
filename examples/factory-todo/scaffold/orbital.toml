# 팩토리 「할 일 카드」의 스캐폴드. 의존성 없이 뜨는 Node 서버 하나다

[[service]]
name = "web"
kind = "server"
build = "node --check server.js"
start = "node server.js"
path = "/"
roles = ["member"]

[database]
schemas = ["todo"]
migrations = "db/migrations"
roles = ["member"]
seed = "db/seed"

[secrets]
generated = ["SESSION_KEY"]
