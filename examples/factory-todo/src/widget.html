<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>승인 카드</title>
<style>
    :root
    {
        color-scheme: light dark;
        --bg: var(--color-background-primary, light-dark(#ffffff, #1f1f1e));
        --fg: var(--color-text-primary, light-dark(#1f1f1e, #f5f4ef));
        --muted: var(--color-text-secondary, light-dark(#6b6a64, #a8a69c));
        --line: var(--color-border-primary, light-dark(#e4e2da, #3a3936));
        --accent: light-dark(#c96442, #d97757);
        font-family: var(--font-sans, system-ui, sans-serif);
    }

    html, body { margin: 0; background: var(--bg); color: var(--fg); }
    main { display: flex; flex-direction: column; gap: 10px; padding: 14px 16px; font-size: 14px; }
    h1 { margin: 0; font-size: 15px; }
    h2 { margin: 6px 0 0; font-size: 13px; }
    p, dl { margin: 0; }
    dt { font-size: 12px; color: var(--muted); }
    dd { margin: 0; }
    ul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 4px; }
    code { font-size: 12px; }
    .muted { color: var(--muted); font-size: 13px; }
    .actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
    button { font: inherit; font-size: 13px; padding: 4px 10px; border-radius: 6px; border: 1px solid var(--line); background: transparent; color: var(--fg); cursor: pointer; }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    button:disabled { opacity: .6; cursor: default; }
</style>
</head>
<body>
<main>
    <div id="card"><p class="muted">승인 카드를 불러오는 중이에요.</p></div>
    <p id="status" class="muted" role="status"></p>
</main>
<script>
// 화면은 서버가 지은 카드(`_meta["factory-todo/card"]`)를 꽂기만 한다. 무엇을 보일지와 승인 단추가 설지는 서버가 정한다.
// MCP Apps 호스트(하모니 · 클로드)에서는 postMessage 위의 JSON-RPC 다리로, ChatGPT 에서는 window.openai 로 도구를 부른다.
(function ()
{
    var CARD = "factory-todo/card";
    var openai = window.openai;
    var api = openai ? "openai" : "mcp";
    var seq = 0;
    var waiting = {};
    var $ = function (id) { return document.getElementById(id); };
    var say = function (text) { $("status").textContent = text; };

    function request(method, params)
    {
        seq += 1;
        var id = "card-" + seq;

        return new Promise(function (resolve, reject)
        {
            waiting[id] = { resolve: resolve, reject: reject };
            window.parent.postMessage({ jsonrpc: "2.0", id: id, method: method, params: params }, "*");
        });
    }

    function callTool(name, args)
    {
        return api === "openai" ? openai.callTool(name, args) : request("tools/call", { name: name, arguments: args });
    }

    function show(result)
    {
        var html = result && result._meta && result._meta[CARD];

        if (typeof html === "string")
        {
            $("card").innerHTML = html;
        }
    }

    $("card").addEventListener("click", function (event)
    {
        var button = event.target.closest("button[data-action]");

        if (!button)
        {
            return;
        }

        button.disabled = true;

        if (button.dataset.action === "approve")
        {
            say("운영에 올리는 중이에요.");
            callTool("promotion_approve", { release: button.dataset.release, approval: button.dataset.approval }).then(function (result)
            {
                show(result);
                say(result && result.isError ? "" : "운영에 올렸어요.");

                if (api === "mcp" && result && !result.isError)
                {
                    request("ui/update-model-context", { content: [{ type: "text", text: "사람이 승인 카드에서 승인해 운영에 올렸어요." }] }).catch(function () { return undefined; });
                }
            }).catch(function () { say("올리지 못했어요. 다시 보기를 눌러 주세요."); button.disabled = false; });

            return;
        }

        say("");
        callTool("promotion_show", {}).then(show).catch(function () { say("카드를 다시 불러오지 못했어요."); button.disabled = false; });
    });

    if (api === "openai")
    {
        show({ _meta: openai.toolResponseMetadata });
        window.addEventListener("openai:set_globals", function (event)
        {
            var globals = event.detail && event.detail.globals;

            if (globals && globals.toolResponseMetadata)
            {
                show({ _meta: globals.toolResponseMetadata });
            }
        });

        return;
    }

    window.addEventListener("message", function (event)
    {
        var message = event.data;

        if (event.source !== window.parent || !message || message.jsonrpc !== "2.0")
        {
            return;
        }

        if (message.id !== undefined && waiting[message.id] && message.method === undefined)
        {
            var waiter = waiting[message.id];

            delete waiting[message.id];

            if (message.error) { waiter.reject(new Error(message.error.message)); } else { waiter.resolve(message.result); }

            return;
        }

        if (message.method === "ui/notifications/tool-result")
        {
            show(message.params);
        }

        if (message.method === "ui/resource-teardown" && message.id !== undefined)
        {
            window.parent.postMessage({ jsonrpc: "2.0", id: message.id, result: {} }, "*");
        }
    });

    request("ui/initialize", {
        appInfo: { name: "factory-todo", version: "0.1.0" },
        appCapabilities: { availableDisplayModes: ["inline"] },
        protocolVersion: "2026-01-26",
    }).then(function ()
    {
        window.parent.postMessage({ jsonrpc: "2.0", method: "ui/notifications/initialized", params: {} }, "*");
    });
})();
</script>
</body>
</html>
