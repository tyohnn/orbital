# orbital.toml: 필요한 것의 이름을 적는다. 값은 적지 않는다
# NestJS API 와 Vite 화면을 한 저장소에 둔 스캐폴드의 예다

[build]
command = "npm ci"                # 저장소에서 한 번, 서비스의 빌드보다 먼저 돈다. 의존성(workspaces 둘의 것)은 여기서만 받는다

[[service]]
name = "api"
kind = "server"                   # 요청을 받는 서버. 쉬면 재운다
build = "npm run build -w api"    # [build] 가 받아 둔 node_modules 를 쓴다
start = "npm run start -w api"
path = "/api"                     # 이 경로로 온 요청을 받는다
roles = ["employee", "manager", "payroll_admin"]   # 이 서비스가 쓸 수 있는 업무 역할

[[service]]
name = "web"
kind = "static"                   # 빌드한 파일을 router 가 바로 내준다. 서버가 없다
build = "npm run build -w web"
output = "web/dist"
path = "/"
fallback = "index.html"           # 화면 안의 경로(/payslips/2026-11)를 새로 고쳐도 화면이 뜬다. 스크립트 · 그림의 404 는 그대로다

[[schedule]]                      # 레이어가 이 시각(UTC, 매달 25일 09:00)에 API 를 깨워 POST 로 부른다. 운영에서만 부른다
service = "api"                   # 요청에는 x-orbital-schedule 이 실린다. 이 경로는 밖에서 부르지 못한다
cron = "0 9 25 * *"
path = "/api/jobs/payroll"
role = "payroll_admin"            # 사람 없이 이 업무 역할만 실린 신원을 싣는다(모든 행 권한만, 자기 행은 없음). 승인 카드에 이 문장이 선다

[database]
schemas = ["hr", "payroll"]
migrations = "db/migrations"
roles = ["employee", "manager", "payroll_admin"]
seed = "db/seed"

[secrets]
generated = ["SESSION_KEY"]     # 레이어가 만든다. 아무도 보지 못한다
external = ["BANK_API_KEY"]     # 사람이 입력 화면에서 한 번 넣는다. 에이전트는 이름만 본다

# 로그인은 레이어가 맡는다. 화면은 정적 서비스 하나라 첫 화면(/)이 로그인 칸을 함께 그린다
[auth]
methods = ["email_link"]
login_path = "/"
