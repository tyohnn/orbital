# Next.js(App Router) 풀스택 스캐폴드의 예다. 서버 서비스 하나만 적는다.
# 빌드는 레이어가 그 commit 에서 직접 돌린다. 의존성은 package-lock.json 대로 받는다(npm ci)

[[service]]
name = "web"
kind = "server"
build = "npm ci && npm run build"
start = "npm run start"           # next start 는 PORT 를 읽는다. 듣는 주소는 package.json 의 -H 127.0.0.1 이 정한다(HOSTNAME 은 읽지 않는다)
path = "/"
roles = ["member"]
auth = "required"                 # 로그인한 사람만 들어온다. 아니면 레이어가 [auth].login_path 로 보낸다
public = ["/_next/static"]        # 로그인 화면의 스크립트와 글꼴. 로그인 없이 내주고 신원은 싣지 않는다

[database]
schemas = ["todo"]
migrations = "db/migrations"
roles = ["member"]
seed = "db/seed"

# 로그인은 레이어가 맡는다. 로그인 화면(/login)과 그 아래, 공개 경로는 로그인 없이 열린다
[auth]
methods = ["email_link"]
login_path = "/login"
