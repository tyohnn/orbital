# 비밀 테스트가 쓰는 스캐폴드. 은행의 키 하나를 밖에서 넣는다고 선언하고, 받은 값의 sha256 만 내준다. 의존성 없이 뜨는 Node 서버 하나다

[[service]]
name = "web"
kind = "server"
build = "node build.js"
start = "node server.js"
path = "/"
roles = ["member"]

[database]
schemas = ["ledger"]
migrations = "db/migrations"
roles = ["member"]

[secrets]
generated = ["SESSION_KEY"]
external = ["BANK_API_KEY"]
