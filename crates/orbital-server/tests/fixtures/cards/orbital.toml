# 로그인 한 바퀴 테스트가 쓰는 스캐폴드. 앱(server.js · db/)은 `fixtures/todo` 의 것을 그대로 쓰고 이 파일과 `site/` 만 덮는다.
# 앱에는 로그인 화면(/login)과 자기 카드 목록만 있고 로그인 코드는 없다. 로그인은 레이어가 맡는다

[[service]]
name = "web"
kind = "server"
build = "node --check server.js"
start = "node server.js"
path = "/"
roles = ["member"]
auth = "required"

[[service]]
name = "site"
kind = "static"
build = "true"
output = "site"
path = "/static"

[database]
schemas = ["todo"]
migrations = "db/migrations"
roles = ["member"]
seed = "db/seed"

[secrets]
generated = ["SESSION_KEY"]

[auth]
methods = ["email_link"]
login_path = "/login"
