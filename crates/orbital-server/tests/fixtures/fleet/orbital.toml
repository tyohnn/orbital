# rollout 테스트가 쓰는 스캐폴드(v1). 의존성 없이 뜨는 Node 서버 하나이고 DB 를 쓰지 않는다.
# 포크마다 고치는 자리는 `custom.json` 이다. 업데이트(v2)는 `fixtures/fleet-update` 의 파일을 덮어 만든다

[[service]]
name = "web"
kind = "server"
build = "node --check server.js"
start = "node server.js"
path = "/"

# 적합성 테스트. 레이어는 이 칸과 폴더를 포크의 것이 아니라 위쪽(앱의 commit)의 것으로 돌린다
[conformance]
run = "node conformance/check.mjs"
files = "conformance"
