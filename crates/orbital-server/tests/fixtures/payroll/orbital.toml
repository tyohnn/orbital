# 업무 역할이 둘인 스캐폴드. 직원은 자기 급여만, 급여 관리자는 모두 읽는다(`examples/hr-nest-vite` 를 줄인 것)

[[service]]
name = "web"
kind = "server"
build = "node --check server.js"
start = "node server.js"
path = "/"
roles = ["employee", "payroll_admin"]
auth = "required"

[database]
schemas = ["payroll"]
migrations = "db/migrations"
roles = ["employee", "payroll_admin"]
seed = "db/seed"

[auth]
methods = ["email_link"]
login_path = "/login"
