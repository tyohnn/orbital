[package]
name = "orbital-cli"
description = "Orbital 의 CLI. 에이전트가 sandbox 에서 선언과 권한 표를 올리기 전에 검사한다"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "orbital"
path = "src/main.rs"

[dependencies]
orbital-core = { path = "../orbital-core" }
serde_json.workspace = true
toml.workspace = true
# 운영의 레이어는 `https` 로 듣는다. 다른 crate 가 켜 준 feature 에 기대지 않고 여기서 켠다(혼자 빌드해도 TLS 가 든다)
ureq = { workspace = true, features = ["tls"] }

[dev-dependencies]
orbital-run = { path = "../orbital-run" }
orbital-server = { path = "../orbital-server" }
tiny_http.workspace = true

[lints]
workspace = true
